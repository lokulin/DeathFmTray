name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'          # e.g. v1.0.0, v1.2.3
  workflow_dispatch:      # allows manual runs from the Actions tab

permissions:
  contents: write         # required so the workflow can create a release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Match the project's TargetFramework (net8.0-windows...)
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DeathFmTray.csproj

      - name: Publish (framework-dependent, single-file, win-x64)
        run: >
          dotnet publish DeathFmTray.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip published output
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          Compress-Archive -Path publish\* -DestinationPath "DeathFmTray-$version-win-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DeathFmTray-*.zip
          generate_release_notes: true
